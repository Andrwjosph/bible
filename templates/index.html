<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible AI Chat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="chat-container">
        <div class="welcome-section">
            <h1>Hi there, <span class="highlight"></span></h1>
            <p class="subtitle">What would you like to know?</p>
            
            <div class="suggestion-cards">
                <button class="suggestion-card">
                   What does bible say about love?
                </button>
                <button class="suggestion-card">
                    Who is Jesus?
                </button>
                <button class="suggestion-card">
                    What are the ten commandments?
                </button>
                <button class="suggestion-card">
                    How many books are there in the bible?
                </button>
            </div>
        </div>

        <div id="chat-box"></div>
        <div id="typing-indicator" class="hidden">thinking...</div>
        
        <div class="input-container">
            <form id="chat-form">
                <div class="input-wrapper">
                    <input type="text" id="user-input" placeholder="Ask what you want..." required>
                    <div class="input-actions">
                        <button type="button" class="action-button">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
                            </svg>
                        </button>
                        <button type="submit" class="send-button">Send</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
